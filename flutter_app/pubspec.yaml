name: matematik_akademi
description: Sıfırdan ileri seviyeye Türkçe matematik öğrenme uygulaması.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  fl_chart: ^0.71.0
  flutter_math_fork: ^0.7.4
  flutter_animate: ^4.5.2
  flutter_tts: ^4.2.3
  drift: ^2.28.2
  drift_flutter: ^0.2.4
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
